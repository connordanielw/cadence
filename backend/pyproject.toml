[project]
name = "cadence-backend"
version = "0.1.0"
description = "Semantic search for a music library."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "alembic>=1.14",
  "python-multipart>=0.0.17",
  "anthropic>=0.39",
  "voyageai>=0.3",
  "pypdf>=5.1",
  "pdf2image>=1.17",
  "pytesseract>=0.3.13",
  "librosa>=0.10.2",
  "soundfile>=0.12.1",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
